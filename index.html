<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPL Data Bank</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://dpl-project.onrender.com">
</head>
<body>
    <!-- Login Page -->
    <div id="login-page" class="page active">
        <div class="auth-box">
            <div class="auth-header">
                <h1>DPL Data Bank</h1>
                <p>Please sign in to continue</p>
            </div>
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="btn-login" class="btn btn-primary btn-full">Login</button>
                <div id="login-error" class="error-msg hidden"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-page" class="page">
        <button id="btn-sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
            <span></span><span></span><span></span>
        </button>
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h2>DPL Data Bank</h2>
                <div id="user-info">
                    <span id="user-name"></span>
                    <span id="user-level-badge"></span>
                </div>
            </div>
            <ul class="sidebar-menu" id="sidebar-menu">
                <!-- Populated by app.js based on user permissions -->
            </ul>
            <div class="sidebar-footer">
                <button id="btn-logout" class="btn btn-danger btn-full">Logout</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content">
            <header class="topbar">
                <h1 id="page-title">Dashboard</h1>
                <div class="topbar-info">
                    <span id="topbar-user"></span>
                </div>
            </header>
            <div id="page-content">
                <!-- Sections rendered here by page modules -->
            </div>
        </main>
    </div>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Modal container -->
    <div id="modal-container" class="modal-overlay">
        <div class="modal">
            <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
            <h3 id="modal-title"></h3>
            <div id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <!-- Scripts loaded in order -->
    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/mapping.js"></script>
    <script defer src="js/table.js"></script>
    <script defer src="js/logs.js"></script>
    <script defer src="js/customfields.js"></script>
    <script defer src="js/upload.js"></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/users.js"></script>
    <script defer src="js/app.js"></script>
</body>
</html>
